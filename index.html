<style>
:root{--line:rgba(255,255,255,.13);--card:rgba(255,255,255,.06);--txt:#f2f0ff;--dim:#a099c4;
--neon:#00e5ff;--pink:#ff3d97;--purp:#8b5cf6;--gold:#ffd76e;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;
background:radial-gradient(120% 80% at 50% -10%,#2a1150 0%,#0a0a14 55%,#05050a 100%);color:var(--txt);overflow:hidden}
#pinwall{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(120% 80% at 50% -10%,#2a1150 0%,#0a0a14 55%,#05050a 100%);padding:24px}
.pinbox{width:100%;max-width:280px;text-align:center}
.pin-logo{font-weight:800;letter-spacing:.22em;font-size:22px;background:linear-gradient(90deg,var(--neon),var(--pink));
 -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.pin-sub{font-size:10px;color:var(--dim);letter-spacing:.18em;margin-bottom:26px}
.pin-dots{display:flex;justify-content:center;gap:14px;margin-bottom:22px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.2);transition:all .15s}
.pin-dot.on{background:var(--neon);border-color:var(--neon);box-shadow:0 0 10px var(--neon)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.pin-key{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:14px;
 color:#f2f0ff;font-size:20px;font-weight:700;padding:15px 0;font-family:inherit;transition:background .1s;cursor:pointer}
.pin-key:active{background:rgba(0,229,255,.18)}
.pin-err{color:#ff8fb8;font-size:11px;min-height:16px;margin-top:10px;letter-spacing:.08em}
#app{display:none;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative}
header{padding:12px 16px 6px;flex:0 0 auto}
.brand{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;letter-spacing:.22em;font-size:14px;background:linear-gradient(90deg,var(--neon),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.who{font-size:9.5px;color:var(--dim);letter-spacing:.16em}
.balance{margin-top:8px;padding:13px 15px;border-radius:18px;position:relative;overflow:hidden;
background:linear-gradient(135deg,rgba(0,229,255,.16),rgba(255,61,151,.16));border:1px solid var(--line)}
.bal-row{display:flex;align-items:flex-end;gap:9px}
.bal-n{font-size:40px;font-weight:800;line-height:1}
.bal-l{font-size:10.5px;color:var(--dim);letter-spacing:.2em;padding-bottom:5px}
.chips{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.chip{font-size:9.5px;padding:5px 8px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.chip.hot{border-color:var(--gold);color:var(--gold)}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 96px}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:rgba(8,8,16,.9);
backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:var(--safe);z-index:40}
nav button{flex:1;background:none;border:0;color:var(--dim);font-size:9px;letter-spacing:.1em;
padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;position:relative}
nav button .ic{font-size:18px;line-height:1}
nav button.on{color:var(--txt)}
nav button.on .ic{filter:drop-shadow(0 0 8px var(--neon))}
.badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--pink);color:#fff;font-size:8.5px;
min-width:15px;height:15px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:800}
.sec-t{font-size:9.5px;letter-spacing:.22em;color:var(--dim);margin:16px 0 7px;font-weight:800}
.pool{border-radius:20px;padding:14px;margin-bottom:10px;border:1px solid var(--line);overflow:hidden}
.p1{background:linear-gradient(120deg,#14243a,#0d1420)}.p3{background:linear-gradient(120deg,#0f2f3a,#0c1a24)}
.p5{background:linear-gradient(120deg,#3a1140,#180c24)}.p10{background:linear-gradient(120deg,#4a1230,#2a0d3a 60%,#12061c)}
.pool h3{margin:0;font-size:15.5px;font-weight:800}
.sub{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.45}
.rowb{display:flex;align-items:center;justify-content:space-between;margin-top:11px;gap:10px}
.spin{border:0;border-radius:14px;padding:11px 15px;font-weight:800;font-size:12.5px;letter-spacing:.05em;
background:linear-gradient(90deg,var(--neon),var(--purp));color:#08131a;font-family:inherit}
.spin.g{background:linear-gradient(90deg,var(--gold),var(--pink));color:#2a0713}
.spin:disabled{background:#22222e;color:#5a5a70}
.pity{font-size:9px;color:var(--dim);letter-spacing:.08em}
.bar{height:4px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:5px;width:110px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold))}
.oddsbtn{margin-top:9px;width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--dim);
border-radius:11px;padding:8px;font-size:10px;letter-spacing:.14em;font-weight:700;font-family:inherit}
.odds{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.orow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:11px;border-bottom:1px solid rgba(255,255,255,.05)}
.orow .n{flex:1}.orow .pct{font-weight:800;font-variant-numeric:tabular-nums}
.orow small{display:block;color:#000;font-size:9.5px;margin-top:1px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pc{border-radius:16px;border:1px solid var(--line);position:relative;aspect-ratio:.68;overflow:hidden;
background-size:cover;background-position:center}
.pc .face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;
background:linear-gradient(transparent 45%,rgba(0,0,0,.72))}
.pc .nm{font-weight:800;font-size:13px}
.pc .rl{font-size:8.5px;letter-spacing:.14em;color:rgba(255,255,255,.75)}
.pc .ct{position:absolute;top:7px;right:8px;font-size:9px;background:rgba(0,0,0,.55);padding:3px 7px;border-radius:99px}
.pc.locked{filter:grayscale(1) brightness(.4)}
.pc.locked .face:after{content:"?";position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:800;opacity:.7}
.k{background-image:linear-gradient(160deg,#ff7ac2,#7b2ff7)}.w{background-image:linear-gradient(160deg,#8fe9ff,#2b6bff)}
.g{background-image:linear-gradient(160deg,#ffd88a,#ff5f6d)}.n{background-image:linear-gradient(160deg,#498a4e,#00b3a4)}
.box{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px;background:rgba(255,255,255,.035)}
.box.dash{border-style:dashed}
.hint{font-size:10.5px;color:var(--dim);line-height:1.55}
.li{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);position:relative;padding-left:14px}
.li:before{content:"";position:absolute;left:0;top:14px;width:7px;height:7px;border-radius:99px;background:var(--purp)}
.li.earn:before{background:var(--neon)}.li.prize:before{background:var(--gold)}
.li.card:before{background:var(--pink)}.li.reject:before{background:#ff5f6d}
.li .t{font-size:13px;font-weight:600;padding-right:52px}
.li .m{font-size:10px;color:var(--dim);margin-top:2px}
.li .v{position:absolute;right:0;top:10px;font-size:13px;font-weight:800}
input,select,textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--txt);
border-radius:11px;padding:10px 11px;font-size:15px;margin-top:6px;font-family:inherit;-webkit-appearance:none}
textarea{min-height:70px;font-size:12px}
label.f{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--dim);margin-top:9px;font-weight:700}
.btn{width:100%;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:13.5px;margin-top:9px;
background:linear-gradient(90deg,var(--pink),var(--purp));color:#fff;font-family:inherit;letter-spacing:.04em}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt)}
.btn.ok{background:linear-gradient(90deg,#00e5ff,#22c55e);color:#04140c}
.btn.no{background:rgba(255,95,109,.18);border:1px solid rgba(255,95,109,.5);color:#ffb3ba}
.btn.sm{padding:9px;font-size:11.5px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.q{border:1px solid var(--line);background:var(--card);border-radius:13px;padding:10px 9px;text-align:left;

.q b{display:block;font-size:12px}.q span{font-size:9.5px;color:var(--dim)}
.q.on{border-color:var(--neon);background:rgba(0,229,255,.13)}
.thumb{width:100%;border-radius:12px;margin-top:7px;display:block}
.pend{border:1px solid var(--line);border-radius:15px;padding:11px;margin-bottom:9px;background:rgba(255,255,255,.04)}
.pthumb{width:72px;height:72px;object-fit:cover;border-radius:10px;float:left;margin:0 10px 6px 0}
.item{border:1px solid var(--line);border-radius:13px;padding:9px;margin-top:7px;background:rgba(0,0,0,.22)}
.tag{display:inline-block;font-size:8.5px;letter-spacing:.12em;padding:3px 6px;border-radius:99px;border:1px solid var(--line);color:var(--dim);margin-right:4px}
.buffbar{display:flex;flex-direction:column;gap:6px}
.buff{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:9px 11px;border-radius:12px;
background:linear-gradient(90deg,rgba(123,255,207,.16),rgba(139,92,246,.16));border:1px solid rgba(123,255,207,.4)}
.buff b{font-size:11.5px}
#rev{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:22px;
background:radial-gradient(60% 50% at 50% 45%,rgba(120,40,200,.55),rgba(4,4,10,.97));backdrop-filter:blur(6px)}
#rev.show{display:flex}
.revcard{width:100%;max-width:330px;text-align:center}
.orb{width:126px;height:126px;border-radius:50%;margin:0 auto 16px;
background:conic-gradient(from 0deg,var(--neon),var(--pink),var(--gold),var(--neon));
animation:sp 1s linear infinite;box-shadow:0 0 55px rgba(255,61,151,.5)}
@keyframes sp{to{transform:rotate(360deg)}}
.prizebox{border-radius:20px;padding:20px 17px;border:1px solid var(--line);
background:linear-gradient(150deg,rgba(255,255,255,.13),rgba(255,255,255,.03));animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
.rr{font-size:9.5px;letter-spacing:.26em;font-weight:800}
.rp{font-size:20px;font-weight:800;margin:8px 0 6px;line-height:1.25}
.rd{font-size:12px;color:var(--dim);line-height:1.5}
.pcpull{margin-top:13px;padding:11px;border-radius:13px;background:rgba(255,61,151,.16);
border:1px solid rgba(255,61,151,.4);font-size:12px}
.toast{position:absolute;bottom:78px;left:16px;right:16px;background:rgba(255,255,255,.14);border:1px solid var(--line);
backdrop-filter:blur(14px);border-radius:13px;padding:11px 13px;font-size:12px;z-index:70;display:none}
.toast.show{display:block;animation:pop .3s}
.filerow{position:relative;overflow:hidden;display:block}
.filerow input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.unlock-bar{height:7px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}
.unlock-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purp),var(--pink));transition:width .5s}
.welcome-card{background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(139,92,246,.12));
border:1px solid rgba(0,229,255,.3);border-radius:16px;padding:13px;margin-top:6px}
</style>

var S = null;
var _docRef = null;

function initApp(){
  if(window._aedb){
    document.getElementById("mode").textContent="CLOUD SYNC";
    _docRef=window._aedb.collection("aequest").doc("state");
    _docRef.get().then(function(snap){
      S=snap.exists?snap.data():defState();
      _migrate();
      render();
    }).catch(function(e){
      console.warn("Firestore load failed, falling back to localStorage",e);
      _loadLocal();
      render();
    });
  } else {
    _loadLocal();
    render();
  }
}
function _loadLocal(){
  var raw=null;
  try{raw=JSON.parse(localStorage.getItem("aequest_v3"))}catch(e){}
  S=(raw&&raw.v===VER)?raw:defState();
  _migrate();
}
function _migrate(){
  if(S.lifetimeTokens==null)S.lifetimeTokens=0;
  S.tasks.forEach(function(t){if(t.unlockAt==null)t.unlockAt=0;});
}
function save(){
  if(_docRef){
    _docRef.set(JSON.parse(JSON.stringify(S))).catch(function(e){
      console.warn("Firestore save error",e);
    });
  } else {
    try{localStorage.setItem("aequest_v3",JSON.stringify(S))}
    catch(e){toast("Storage full. Clear old photos in Admin > Tools.");}
  }
}

function render(){

/* ---------- Actions ---------- */
function grantTokens(n,title,meta,photo){
 var mult=multNow(),amt=Math.round(n*mult*100)/100,bonus=0;
 if(/pomodoro|pomo/i.test(title)){for(var i=0;i<S.buffs.length;i++){var b=S.buffs[i];
  if(b.kind==="bounty"&&b.uses>0){bonus=1;b.uses--;break}}}
 amt=Math.ceil(amt)+bonus;
 var prevLT=S.lifetimeTokens||0;
 S.tokens+=amt;S.lifetimeTokens=(S.lifetimeTokens||0)+amt;
 if(/pomodoro/i.test(title))S.pomosToday+=1;
 pruneBuffs();
 pushLog({type:"earn",title:title,meta:(meta||"approved")+(mult>1?" &middot; x"+mult+" buff":"")+(bonus?" &middot; +1 bounty":""),value:"+"+amt,photo:photo||null});
 checkUnlocks(prevLT,S.lifetimeTokens);
 save();render();toast("+"+amt+" token"+(amt===1?"":"s")+"  "+title);
}
function applyEffect(e){
 if(!e||e==="none")return;
 if(e.indexOf("m")===0){var map={m15_24:[1.5,24],m2_24:[2,24],m2_72:[2,72],m3_24:[3,24]},cfg=map[e];
  if(cfg){S.buffs.push({kind:"mult",value:cfg[0],label:"x"+cfg[0]+" tokens",until:Date.now()+cfg[1]*3600e3});return}}
 if(e==="bounty3"){S.buffs.push({kind:"bounty",label:"+1 token per pomodoro",uses:3,until:null});return}
 if(e==="spin1")S.tokens+=1;if(e==="spin3")S.tokens+=3;if(e==="spin5")S.tokens+=5;if(e==="spin10")S.tokens+=10;
 if(e==="shards5")S.shards+=5;
}
function giveCard(cardIdx,silent){
 var st=activeSet(),c=st.cards[cardIdx];if(!c)return null;
 var isNew=!c.n;c.n++;if(!isNew)S.shards+=3;
 pushLog({type:"card",title:"Photocard: "+c.nm,meta:isNew?"NEW &middot; "+st.name:"duplicate, +3 shards"});
 if(st.cards.every(function(x){return x.n>0}))completeSet();
 save();if(!silent)render();return{nm:c.nm,isNew:isNew};
}
function completeSet(){
 var st=activeSet();st.completed=true;S.setsDone++;S.tokens+=10;
 pushLog({type:"prize",title:"SET COMPLETE: "+st.name,meta:"+10 tokens and a KWANGYA-tier prize",value:"+10"});
 var next=-1;S.sets.forEach(function(s,i){if(!s.completed&&next<0)next=i});
 if(next<0){var clone=JSON.parse(JSON.stringify(st));clone.id="s"+(S.sets.length+1);
  clone.name="ARMAGEDDON SET "+(S.sets.length+1);clone.completed=false;clone.cards.forEach(function(c){c.n=0});
  S.sets.push(clone);next=S.sets.length-1;}
 S.active=next;setTimeout(function(){toast("SET COMPLETE! +10 tokens and a KWANGYA-tier prize.")},900);
}
function doSpin(cost,free){
 var P=S.pools[cost];
 if(!free){if(S.tokens<cost)return toast("Not enough tokens");S.tokens-=cost}
 var R=$("#rev");R.className="show";
 R.innerHTML='<div class="revcard"><div class="orb"></div><div style="letter-spacing:.3em;font-size:10.5px;color:#cbb8ff">SYNKING</div></div>';
 setTimeout(function(){
  S.pity[cost]=(S.pity[cost]||0)+1;
  var item,forced=false;
  var pool=P.items.filter(function(i){return(Number(i.w)||0)>0});
  if(!pool.length){R.className="";return toast("That pool has no prizes with weight above zero")}
  if(S.pity[cost]>=P.pity){var good=pool.filter(function(i){return GOOD.indexOf(i.r)>-1});
   item=good.length?rollItem(good):rollItem(pool);forced=true;S.pity[cost]=0;}
  else{item=rollItem(pool);if(GOOD.indexOf(item.r)>-1)S.pity[cost]=0;}
  if(item.s&&S.revealed.indexOf(item.id)<0)S.revealed.push(item.id);
  pushLog({type:"prize",title:item.p,meta:P.name+" &middot; "+item.r+(forced?" &middot; PITY BREAK":""),value:free?"FREE":"-"+cost});
  applyEffect(item.e);
  var pulls=[];
  if(item.e==="setskip"){var st=activeSet();st.cards.forEach(function(c,ix){if(!c.n)giveCard(ix,true)});}
  else{var want=item.e==="card2"?2:(item.e==="card1"?1:(Math.random()<P.cardChance?1:0));
   for(var k=0;k<want;k++){var st2=activeSet();
    var missing=[];st2.cards.forEach(function(c,ix){if(!c.n)missing.push(ix)});
    var from=(missing.length&&Math.random()<.75)?missing:st2.cards.map(function(c,ix){return ix});
    var got=giveCard(from[Math.floor(Math.random()*from.length)],true);if(got)pulls.push(got);}}
  save();
  var h='<div class="revcard"><div class="prizebox">'+
   '<div class="rr" style="color:'+(RCOLOR[item.r]||"#fff")+'">'+esc(item.r)+(forced?" &middot; PITY BREAK":"")+' &middot; '+esc(P.name)+'</div>'+
   '<div class="rp">'+esc(item.p)+'</div><div class="rd">'+esc(item.d)+'</div>';
  if(item.e&&item.e!=="none")h+='<div class="rd" style="margin-top:8px;color:#7bffcf">EFFECT: '+EFFECTS[item.e]+'</div>';
  if(pulls.length){h+='<div class="pcpull">PHOTOCARD: '+pulls.map(function(p){
   return"<b>"+esc(p.nm)+"</b>"+(p.isNew?" NEW":" (dupe, +3 shards)")}).join(" + ")+
   '<br><span style="color:rgba(255,255,255,.6);font-size:11px">'+owned()+"/"+activeSet().cards.length+" in "+esc(activeSet().name)+'</span></div>';}
  h+='</div><button class="btn" data-act="close">COLLECT</button>';
  if(S.tokens>=cost)h+='<button class="btn ghost" data-act="again" data-pool="'+cost+'">SPIN AGAIN &middot; '+cost+'</button>';
  h+='</div>';R.innerHTML=h;
 },1400);
}

 if(d.es){S.sets[+d.es][d.f]=el.value;save();render();return}
 if(d.ec){S.sets[+d.ec].cards[+d.i][d.f]=el.value;save();render();return}
 if(d.et){var t=S.tasks[+d.et];if(!t)return;
  if(d.f==="tok")t.tok=parseInt(el.value,10)||0;
  else if(d.f==="days"){var dv=parseInt(el.value,10);t.until=(!dv||dv<=0)?null:Date.now()+dv*864e5;}
  else if(d.f==="unlockAt")t.unlockAt=Math.max(0,parseInt(el.value,10)||0);
  else t[d.f]=el.value;save();render();return}
});

/* ==========================================================
   PIN WALL
   ========================================================== */
var _pin="";
function _pinUpdate(){for(var i=0;i<4;i++){var d=document.getElementById("pd"+i);if(d)d.className="pin-dot"+(_pin.length>i?" on":"");}}

document.getElementById("pin-pad").addEventListener("click",function(e){
 var k=e.target.closest("[data-k]");if(!k)return;
 var v=k.dataset.k;
 document.getElementById("pin-err").textContent="";
 if(v==="clr")_pin="";
 else if(v==="del")_pin=_pin.slice(0,-1);
 else if(_pin.length<4)_pin+=v;
 _pinUpdate();
 if(_pin.length===4){
  if(_pin===APP_PIN){
   try{sessionStorage.setItem("aequest_ok","1")}catch(e){}
   document.getElementById("pinwall").style.display="none";
   document.getElementById("app").style.display="flex";
   initApp();
  } else {
   document.getElementById("pin-err").textContent="Wrong PIN - try again";
   setTimeout(function(){_pin="";_pinUpdate();},600);
  }
 }
});

/* ---------- Startup ---------- */
var _skip=false;try{_skip=sessionStorage.getItem("aequest_ok")==="1";}catch(e){}
if(_skip){
 document.getElementById("pinwall").style.display="none";
 document.getElementById("app").style.display="flex";
 initApp();
}
</script>
</body>
